<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moved — Meridian</title>
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url={{ to }}">
  <link rel="canonical" href="https://meridianaudit.org{{ to }}">
  <link rel="stylesheet" href="/static/css/base.css">
</head>
<body>
  <main class="site-main">
    <div class="wrap">
      <article class="page">
        <h1>This page has moved</h1>
        <p>
          The content at <code>{{ from_path }}</code> now lives at
          <a href="{{ to }}"><code>{{ to }}</code></a>.
        </p>
        {% if reason %}
        <p class="muted">Reason: {{ reason }}.</p>
        {% endif %}
        <p>
          You should be redirected automatically. If nothing happens,
          <a href="{{ to }}">follow the link</a>.
        </p>
      </article>
    </div>
  </main>
</body>
</html>
