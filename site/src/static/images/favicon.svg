<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Meridian">
  <title>Meridian</title>
  <!-- Rounded square tile in a Prussian-blue tone that reads well on
       both light and dark browser chrome. -->
  <rect width="32" height="32" rx="6" fill="#0b2545"/>
  <!-- Baseline axis across the bottom quadrant. -->
  <line x1="5" y1="24" x2="27" y2="24" stroke="#ededed" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>
  <!-- Three ascending data points: the project's thesis in four shapes. -->
  <circle cx="9"  cy="22" r="2.2" fill="#ededed"/>
  <circle cx="16" cy="17" r="2.2" fill="#ededed"/>
  <circle cx="23" cy="11" r="2.2" fill="#ededed"/>
</svg>
