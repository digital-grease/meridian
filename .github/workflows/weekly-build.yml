name: Weekly build and deploy

on:
  # Chain off the pipeline's successful run so freshly-sampled manifests
  # deploy without manual intervention. GitHub Actions does NOT fire
  # push-triggered workflows on pushes authored by GITHUB_TOKEN — which
  # the pipeline workflow uses to commit the new manifest — so this
  # workflow_run trigger is the actual mechanism that couples the two.
  workflow_run:
    workflows: ["Weekly pipeline publish"]
    types: [completed]
    branches: [main]
  # Belt-and-suspenders cron in case the pipeline didn't run (missed
  # schedule, rate-limited, etc.). Builds from whatever manifest is
  # current on main — same selection logic as workflow_run.
  schedule:
    - cron: "0 0 * * 0"
  # Auto-rebuild on site/template edits too, so pushing CSS or
  # template changes still redeploys without waiting for Sunday.
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/weekly-build.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # When chained off workflow_run, skip the build if the pipeline
    # failed — no point rendering a partial or stale manifest from a
    # broken run. Other triggers (push, cron, dispatch) always proceed.
    if: |
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch previously published urls.txt (for link-rot diff)
        # deploy-pages@v4 publishes directly from a workflow artifact and
        # never writes a `gh-pages` branch, so the old branch-based diff
        # silently no-op'd on every run. Pull the live site's urls.txt
        # instead — if the site isn't live yet (first deploy), the
        # fetch fails and link-rot skips with a clear log line.
        id: prev_urls
        run: |
          mkdir -p .previous-site
          if curl -fsSL --max-time 30 https://meridianaudit.org/urls.txt -o .previous-site/urls.txt; then
            echo "Fetched previous urls.txt ($(wc -l < .previous-site/urls.txt) URLs)"
          else
            echo "Previous urls.txt not reachable (first deploy or site down); link-rot will skip."
            rm -f .previous-site/urls.txt
          fi

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: ">=0.9.17"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        # --exclude-newer enforces the 7-day cooldown on the fallback
        # resolution path. The --frozen path uses uv.lock and is already
        # cooldown-protected at lockfile-update time. See ../../COOLDOWNS.md.
        run: uv sync --frozen || uv sync --exclude-newer "7 days"

      - name: Build site
        # Pick the latest manifest by filename. Manifests are
        # `manifest-YYYY-WNN.json` with zero-padded week numbers, so
        # lexical sort matches chronological order within a year.
        # Across year boundaries (e.g. 2026-W52 → 2027-W01) the same
        # invariant holds because the year prefix sorts first.
        run: |
          set -euo pipefail
          MANIFEST=$(ls -1 site/fixtures/manifest-*.json 2>/dev/null | sort | tail -1)
          if [ -z "$MANIFEST" ]; then
            echo "::error::No manifest files found under site/fixtures/."
            exit 1
          fi
          echo "Building from: $MANIFEST"
          uv run python site/src/build.py --manifest "$MANIFEST" --out site/dist

      - name: Link-rot guard
        run: |
          if [ -f .previous-site/urls.txt ]; then
            uv run python scripts/check_linkrot.py \
              --current site/dist \
              --previous .previous-site
          else
            echo "No previous urls.txt fetched; skipping link-rot guard (first deploy)"
          fi

      - name: Site size guard (fail above 800 MB)
        run: |
          size_kb=$(du -sk site/dist | cut -f1)
          echo "dist size: ${size_kb} KB"
          if [ "$size_kb" -gt 819200 ]; then
            echo "::error::dist/ exceeds 800 MB soft cap. Offload old weeks to R2 or prune."
            exit 1
          fi

      - name: Accessibility audit (axe-core)
        # Hard gate. Local fast-path lives at
        # meridian/tests/test_accessibility.py (@pytest.mark.slow,
        # run with `uv run python -m pytest -m slow`).
        #
        # Pages are served over a local HTTP server because templates
        # reference /static/... as root-relative paths; under file://
        # those 404 and axe evaluates Chromium UA defaults (~440
        # spurious color-contrast violations). See .devloop archive
        # for the audit that established this.
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory site/dist &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT
          for _ in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8765/ -o /dev/null; then break; fi
            sleep 0.25
          done
          # Pick one representative of each per-item page type from the
          # just-built urls.txt. Previously these were pinned to
          # /models/claude-opus-4-7/ etc., which broke every time the
          # manifest's model/axis/prompt set shifted (e.g. odd-week
          # manifests don't include Opus). Fall back to the category
          # index page if the category is empty.
          #
          # Redirect pages (emitted via site/redirects.yaml) are
          # skipped — their meta-refresh fires before axe-core's
          # scanner locks on, producing spurious results.
          pick() {
            for u in $(grep -oE "^$1[^/]+/\$" site/dist/urls.txt); do
              if ! grep -q 'http-equiv="refresh"' "site/dist${u}index.html" 2>/dev/null; then
                echo "$u"
                return
              fi
            done
          }
          MODEL_URL=$(pick "/models/")
          REPORT_URL=$(pick "/reports/")
          AXIS_URL=$(pick "/axes/")
          PROMPT_URL=$(pick "/prompts/")
          BASE=http://127.0.0.1:8765
          # axe-core/cli@4 bundles its own ChromeDriver via npm. That
          # ChromeDriver tracks the latest Chrome (currently 148) and
          # mismatches the GitHub-hosted runner's preinstalled Chrome
          # (currently 147), producing
          #   "session not created: This version of ChromeDriver only
          #    supports Chrome version 148".
          # The runner ships a matching ChromeDriver alongside Chrome;
          # point axe at it via --chromedriver-path so we use the
          # system pair instead of axe's bundled one.
          CHROMEDRIVER_PATH="$(command -v chromedriver || true)"
          if [ -z "$CHROMEDRIVER_PATH" ]; then
            CHROMEDRIVER_PATH="$(find /usr/local/share /usr/bin /opt -maxdepth 5 -name chromedriver -type f 2>/dev/null | head -1)"
          fi
          if [ -z "$CHROMEDRIVER_PATH" ]; then
            echo "::error::No system chromedriver found; axe will fall back to its bundled one (likely Chrome-version mismatch)."
            exit 1
          fi
          echo "using chromedriver: $CHROMEDRIVER_PATH"
          npx --yes -p @axe-core/cli@4 axe \
            --chromedriver-path "$CHROMEDRIVER_PATH" \
            "$BASE/" \
            "$BASE/about/" \
            "$BASE/methodology/" \
            "$BASE${REPORT_URL:-/reports/}" \
            "$BASE${AXIS_URL:-/axes/}" \
            "$BASE${MODEL_URL:-/models/}" \
            "$BASE${PROMPT_URL:-/prompts/}" \
            "$BASE/data/" \
            --exit

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
