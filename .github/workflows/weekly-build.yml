name: Weekly build and deploy

on:
  # Chain off the pipeline's successful run so freshly-sampled manifests
  # deploy without manual intervention. GitHub Actions does NOT fire
  # push-triggered workflows on pushes authored by GITHUB_TOKEN — which
  # the pipeline workflow uses to commit the new manifest — so this
  # workflow_run trigger is the actual mechanism that couples the two.
  workflow_run:
    workflows: ["Weekly pipeline publish"]
    types: [completed]
    branches: [main]
  # Belt-and-suspenders cron in case the pipeline didn't run (missed
  # schedule, rate-limited, etc.). Builds from whatever manifest is
  # current on main — same selection logic as workflow_run.
  schedule:
    - cron: "0 0 * * 0"
  # Auto-rebuild on site/template edits too, so pushing CSS or
  # template changes still redeploys without waiting for Sunday.
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/weekly-build.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Which publish failures block a deploy, and which must not.
    #
    # MUST block: missing or corrupt artifacts. There is nothing to
    # render, or rendering it would put a broken page on a public,
    # citation-quality record. That case is caught by the "Verify
    # published artifacts" guard step below, which inspects what actually
    # landed on main rather than trusting an upstream status.
    #
    # MUST NOT block: a data-quality finding on artifacts that committed
    # cleanly. The pipeline's `health` job going red means a model refused
    # more, returned dead samples, or a past week is missing. Every one of
    # those is a measurement this project exists to publish, and none of
    # them makes the week unrenderable.
    #
    # This gate read `workflow_run.conclusion == 'success'` until
    # 2026-08-15, which conflated the two: 2026-W32 committed cleanly as
    # 6d74411, the health check exited 1 on a refusal-mechanism change,
    # the workflow concluded `failure`, and the deploy was skipped.
    # meridianaudit.org served 2026-W29 for three weeks.
    #
    # Tradeoff, chosen deliberately: a `workflow_run` payload carries the
    # other workflow's overall conclusion and nothing else, no job
    # outputs, so `publish.outputs.artifacts_committed` is not readable
    # from here. The alternative was to have the publish job dispatch this
    # workflow explicitly, which reads the signal exactly but moves the
    # coupling into a step that itself can fail, and leaves the cron and
    # push triggers on a different code path from the weekly one. Instead
    # this runs on anything that was not cancelled and verifies the
    # artifacts directly. Cost: after a genuinely failed publish the site
    # rebuilds from the previous week and redeploys identical content, one
    # wasted build. Benefit: the deploy path no longer depends on anyone
    # correctly classifying an upstream failure.
    if: |
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion != 'cancelled'
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify published artifacts are present and parseable
        # The half of the upstream gate that genuinely must block a
        # deploy, moved out of the `if:` condition and onto the artifacts
        # themselves. Trusting a status meant a clean week could be
        # blocked by an unrelated finding; checking the file means a
        # broken week is blocked no matter which status it arrived with.
        #
        # Pick the latest manifest by filename. Manifests are
        # `manifest-YYYY-WNN.json` with zero-padded week numbers, so
        # lexical sort matches chronological order within a year. Across
        # year boundaries (e.g. 2026-W52 -> 2027-W01) the same invariant
        # holds because the year prefix sorts first.
        id: manifest
        run: |
          set -euo pipefail
          # `|| true` because `pipefail` plus `set -e` would otherwise
          # abort on ls's exit status when the glob matches nothing, and
          # the operator would get a bare "Process exited with code 2"
          # instead of the sentence below.
          MANIFEST=$(ls -1 site/fixtures/manifest-*.json 2>/dev/null | sort | tail -1 || true)
          if [ -z "$MANIFEST" ]; then
            echo "::error::No manifest files found under site/fixtures/; there is nothing to deploy."
            exit 1
          fi
          if ! python3 -c 'import json,sys; json.load(open(sys.argv[1]))' "$MANIFEST"; then
            echo "::error::${MANIFEST} is not parseable JSON. Refusing to deploy a corrupt build."
            exit 1
          fi
          echo "Deploying from: $MANIFEST"
          echo "path=${MANIFEST}" >> "$GITHUB_OUTPUT"

      - name: Fetch previously published urls.txt (for link-rot diff)
        # deploy-pages@v4 publishes directly from a workflow artifact and
        # never writes a `gh-pages` branch, so the old branch-based diff
        # silently no-op'd on every run. Pull the live site's urls.txt
        # instead — if the site isn't live yet (first deploy), the
        # fetch fails and link-rot skips with a clear log line.
        id: prev_urls
        run: |
          mkdir -p .previous-site
          if curl -fsSL --max-time 30 https://meridianaudit.org/urls.txt -o .previous-site/urls.txt; then
            echo "Fetched previous urls.txt ($(wc -l < .previous-site/urls.txt) URLs)"
          else
            echo "Previous urls.txt not reachable (first deploy or site down); link-rot will skip."
            rm -f .previous-site/urls.txt
          fi

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: ">=0.9.17"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        # --exclude-newer enforces the 7-day cooldown on the fallback
        # resolution path. The --frozen path uses uv.lock and is already
        # cooldown-protected at lockfile-update time. See ../../COOLDOWNS.md.
        run: uv sync --frozen || uv sync --exclude-newer "7 days"

      - name: Build site
        # Manifest selection and validation happened in the guard step
        # above, so this builds exactly what was verified rather than
        # re-deriving it and risking the two disagreeing.
        env:
          MANIFEST: ${{ steps.manifest.outputs.path }}
        run: |
          set -euo pipefail
          echo "Building from: $MANIFEST"
          uv run python site/src/build.py --manifest "$MANIFEST" --out site/dist

      - name: Link-rot guard
        # Called unconditionally, on purpose. This used to be wrapped in
        # `if [ -f .previous-site/urls.txt ]`, which duplicated a decision
        # the script already makes and got it wrong: the script's
        # redirect-target check is deliberately placed *before* its own
        # first-build early return, precisely so a missing previous build
        # does not skip it, and the wrapper skipped it in exactly that
        # case. The script prints "treating as first build (OK)" and
        # returns 0 when .previous-site/urls.txt is absent.
        run: |
          uv run python scripts/check_linkrot.py \
            --current site/dist \
            --previous .previous-site

      - name: Site size guard (fail above 800 MB)
        run: |
          size_kb=$(du -sk site/dist | cut -f1)
          echo "dist size: ${size_kb} KB"
          if [ "$size_kb" -gt 819200 ]; then
            echo "::error::dist/ exceeds 800 MB soft cap. Offload old weeks to R2 or prune."
            exit 1
          fi

      - name: Accessibility audit (axe-core)
        # Hard gate. Local fast-path lives at
        # meridian/tests/test_accessibility.py (@pytest.mark.slow,
        # run with `uv run python -m pytest -m slow`).
        #
        # Pages are served over a local HTTP server because templates
        # reference /static/... as root-relative paths; under file://
        # those 404 and axe evaluates Chromium UA defaults (~440
        # spurious color-contrast violations). See .devloop archive
        # for the audit that established this.
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory site/dist &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT
          for _ in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8765/ -o /dev/null; then break; fi
            sleep 0.25
          done
          # Pick one representative of each per-item page type from the
          # just-built urls.txt. Previously these were pinned to
          # /models/claude-opus-4-7/ etc., which broke every time the
          # manifest's model/axis/prompt set shifted (e.g. odd-week
          # manifests don't include Opus). Fall back to the category
          # index page if the category is empty.
          #
          # Redirect pages (emitted via site/redirects.yaml) are
          # skipped — their meta-refresh fires before axe-core's
          # scanner locks on, producing spurious results.
          pick() {
            for u in $(grep -oE "^$1[^/]+/\$" site/dist/urls.txt); do
              if ! grep -q 'http-equiv="refresh"' "site/dist${u}index.html" 2>/dev/null; then
                echo "$u"
                return
              fi
            done
          }
          MODEL_URL=$(pick "/models/")
          REPORT_URL=$(pick "/reports/")
          AXIS_URL=$(pick "/axes/")
          PROMPT_URL=$(pick "/prompts/")
          BASE=http://127.0.0.1:8765
          # axe-core/cli@4 bundles its own ChromeDriver via npm. That
          # ChromeDriver tracks the latest Chrome (currently 148) and
          # mismatches the GitHub-hosted runner's preinstalled Chrome
          # (currently 147), producing
          #   "session not created: This version of ChromeDriver only
          #    supports Chrome version 148".
          # The runner ships a matching ChromeDriver alongside Chrome;
          # point axe at it via --chromedriver-path so we use the
          # system pair instead of axe's bundled one.
          CHROMEDRIVER_PATH="$(command -v chromedriver || true)"
          if [ -z "$CHROMEDRIVER_PATH" ]; then
            CHROMEDRIVER_PATH="$(find /usr/local/share /usr/bin /opt -maxdepth 5 -name chromedriver -type f 2>/dev/null | head -1)"
          fi
          if [ -z "$CHROMEDRIVER_PATH" ]; then
            echo "::error::No system chromedriver found; axe will fall back to its bundled one (likely Chrome-version mismatch)."
            exit 1
          fi
          echo "using chromedriver: $CHROMEDRIVER_PATH"
          npx --yes -p @axe-core/cli@4 axe \
            --chromedriver-path "$CHROMEDRIVER_PATH" \
            "$BASE/" \
            "$BASE/about/" \
            "$BASE/methodology/" \
            "$BASE${REPORT_URL:-/reports/}" \
            "$BASE${AXIS_URL:-/axes/}" \
            "$BASE${MODEL_URL:-/models/}" \
            "$BASE${PROMPT_URL:-/prompts/}" \
            "$BASE/data/" \
            --exit

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # This workflow had no alerting of any kind until 2026-08-15, and the
  # outcome it most needed to report was the one it reported least: when
  # the `build` job's `if:` gate evaluated false the job was *skipped*,
  # which is not a failure, so GitHub sent nothing and no step inside
  # `build` could have run to say otherwise. The site quietly kept serving
  # a stale week. This is a separate job precisely so it still runs when
  # `build` is skipped, and it treats `skipped` as an alertable outcome.
  #
  # Cancelled runs are excluded: `concurrency: pages` cancels nothing
  # automatically, so a cancellation is a human deciding to stop, and a
  # page about it is noise.
  #
  # That has to be said twice, because there are two cancellations in play
  # and this job originally excluded only one of them. `needs.*.result`
  # covers a cancellation of *this* workflow's build or deploy. An upstream
  # cancellation is a different event: the publish workflow is cancelled,
  # `build`'s own `if:` gate evaluates false, `needs.build.result` comes
  # back `skipped` rather than `cancelled`, and the alert fires with "site
  # build did not deploy (skipped/skipped)" for a run somebody stopped on
  # purpose. The `workflow_run.conclusion` clause below excludes that too.
  # It is written with an explicit `github.event_name` guard so the cron,
  # push and dispatch triggers, where `github.event.workflow_run` is null,
  # are not relying on how a null compares to a string.
  alert:
    needs: [build, deploy]
    if: >-
      always() &&
      (github.event_name != 'workflow_run' ||
       github.event.workflow_run.conclusion != 'cancelled') &&
      (needs.build.result == 'failure' || needs.build.result == 'skipped' ||
       needs.deploy.result == 'failure' || needs.deploy.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-2

      # Same SNS topic the orchestrator and the publish workflow use, so
      # every reason the public dashboard might be stale lands in one
      # inbox. Best-effort with `|| true`, matching weekly-pipeline.yml:
      # an alerting problem must never be able to mask, or be mistaken
      # for, the deploy problem it is reporting.
      - name: Alert operator via SNS
        if: always()
        env:
          TOPIC_ARN: ${{ vars.ALERT_TOPIC_ARN }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          TRIGGER: ${{ github.event_name }}
        run: |
          set -uo pipefail
          if [ -z "${TOPIC_ARN:-}" ]; then
            echo "::warning::ALERT_TOPIC_ARN repo variable is unset; skipping SNS alert."
            exit 0
          fi
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          aws sns publish \
            --region us-east-2 \
            --topic-arn "$TOPIC_ARN" \
            --subject "[meridian] site build did not deploy (${BUILD_RESULT}/${DEPLOY_RESULT})" \
            --message "The weekly site build did not reach GitHub Pages.

          build: ${BUILD_RESULT}
          deploy: ${DEPLOY_RESULT}
          triggered by: ${TRIGGER}

          meridianaudit.org is still serving whatever was last deployed, so the
          public record is stale until this is resolved. A 'skipped' build means
          the job's condition was false, not that it failed; a 'failure' means the
          guard, the link-rot check, the size cap or the accessibility audit
          rejected the build.

          Run: ${RUN_URL}" \
            || echo "::warning::SNS publish failed; the workflow run page is the record."
