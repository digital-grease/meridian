name: Weekly pipeline publish

# Architecture (post-EC2 cutover):
#
#   Mon 04:00 America/Chicago  →  EventBridge Scheduler fires the
#                                  meridian-orchestrator Lambda.
#   Lambda starts the cohabit g5.2xlarge (or defers if specter is
#   using it), waits for SSM-reachable, dispatches the wrapper script.
#   Wrapper script samples ALL on-cadence runners (commercial APIs +
#   open-weight roster), uploads raw + manifest + snapshot to S3,
#   stops the instance.
#
#   This workflow runs ~6 hours later and only PUBLISHES — it does no
#   sampling. Pulls the freshly-uploaded artifacts from S3 and commits
#   them to main. The site-build workflow (separate) renders the
#   public dashboard from the committed manifest.
#
# Why CI doesn't sample:
#   - GitHub-hosted runners' AUP restricts use to the repository's
#     "production / testing / deployment / publication of the software
#     project." A 30-90 minute LLM-inference batch is gray under that
#     clause; EC2 takes the question off the table.
#   - All sampling on one host means one snapshot rebuild — no merge
#     dance between hosts.
#
# Required:
#   AWS_ROLE_TO_ASSUME secret = OIDC role ARN with read access to the
#                                meridian S3 archive bucket.
#   `vars.S3_BUCKET` = the bucket name (matches storage.s3.bucket in
#                      meridian/config.yaml).
#   `vars.S3_PREFIX` = optional, defaults to "meridian/" (matches
#                      storage.s3.prefix).

on:
  schedule:
    # Mon 13:00 UTC = Mon 07:00 CDT / 06:00 CST. Buffers >=2h after the
    # EC2 wrapper finishes and uploads (Mon ~04:30-05:30 local).
    - cron: "0 13 * * 1"
  workflow_dispatch:
    inputs:
      week:
        description: "ISO week id (default: previous week, matching the EC2 wrapper)"
        required: false
        type: string

permissions:
  contents: write   # commit manifest+snapshot+run_log
  id-token: write   # for AWS OIDC role assumption
  issues: write     # to open a failure issue if S3 sync fails

concurrency:
  group: pipeline-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve target week
        id: week
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.week }}" ]; then
            echo "week=${{ inputs.week }}" >> "$GITHUB_OUTPUT"
          else
            # Default to the previous ISO week — matches the EC2
            # wrapper's `date -u --date='yesterday' +'%G-W%V'` calc.
            echo "week=$(date -u --date='yesterday' +'%G-W%V')" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-2

      - name: Sync artifacts from S3
        id: sync
        env:
          BUCKET: ${{ vars.S3_BUCKET }}
          PREFIX: ${{ vars.S3_PREFIX }}
          WEEK: ${{ steps.week.outputs.week }}
        run: |
          set -euo pipefail
          PREFIX="${PREFIX:-meridian/}"
          mkdir -p "data/manifests" "data/snapshots/${WEEK}" "site/fixtures"

          # Manifest. Required — abort if absent, the EC2 wrapper didn't
          # produce a run.
          aws s3 cp \
            "s3://${BUCKET}/${PREFIX}manifests/${WEEK}.json" \
            "data/manifests/${WEEK}.json"

          # Site fixture is the same JSON in the build's expected path.
          cp "data/manifests/${WEEK}.json" "site/fixtures/manifest-${WEEK}.json"

          # Snapshot.
          aws s3 cp \
            "s3://${BUCKET}/${PREFIX}snapshots/${WEEK}/responses.jsonl.gz" \
            "data/snapshots/${WEEK}/responses.jsonl.gz"

          # Run-log: full overwrite from S3 (EC2 maintains it as the
          # single appender now). If S3 has no run_log yet (first run),
          # fall back to whatever's in the repo.
          aws s3 cp \
            "s3://${BUCKET}/${PREFIX}run_log.jsonl" \
            "data/run_log.jsonl" || \
            echo "(no run_log in S3 yet; keeping repo copy)"

      - name: Commit fresh artifacts
        if: success()
        env:
          WEEK: ${{ steps.week.outputs.week }}
        run: |
          set -euo pipefail
          git config user.name "meridian[bot]"
          git config user.email "meridian-bot@users.noreply.github.com"
          git add \
            "data/manifests/${WEEK}.json" \
            "data/snapshots/${WEEK}/responses.jsonl.gz" \
            "data/run_log.jsonl" \
            "site/fixtures/manifest-${WEEK}.json" || true
          if git diff --cached --quiet; then
            echo "no artifact changes to commit (S3 may not have updated yet)"
          else
            git commit -m "chore(pipeline): publish ${WEEK} from S3"
            git push
          fi

      # Fail the job loudly if the run itself recorded failures, even
      # though the artifacts published cleanly. Runs AFTER the commit so
      # the raw record is preserved (append-only retention is a hard
      # rule); a non-zero exit here still fires the issue step below.
      - name: Verify run health
        if: success()
        env:
          WEEK: ${{ steps.week.outputs.week }}
        run: python3 scripts/check_run_health.py "${WEEK}"

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const iso = new Date().toISOString().slice(0, 10);
            const run_url = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const health = process.env.HEALTH_DETAIL;
            const body = health
              ? [
                  `The weekly run published its artifacts but recorded failures:`,
                  ``,
                  `    ${health}`,
                  ``,
                  `The raw manifest/snapshot/run_log for ${{ steps.week.outputs.week }} were`,
                  `committed (append-only retention), but the run is not clean. Inspect the`,
                  `run_log entry and the orchestrator Lambda CloudWatch logs, fix the cause,`,
                  `and decide per the no-backfill policy whether to re-run or document the gap.`,
                  ``,
                  `Run: ${run_url}`,
                ].join("\n")
              : [
                  `The weekly publish step failed. Sampling lives on the EC2 cohabit instance now;`,
                  `if the artifact wasn't in S3, check the orchestrator Lambda CloudWatch logs.`,
                  ``,
                  `Run: ${run_url}`,
                  `Re-run via the \`workflow_dispatch\` button on this workflow.`,
                ].join("\n");
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Pipeline ${health ? "run had failures" : "publish failed"}: ${iso}`,
              body,
              labels: ["pipeline", "automated", "bug"],
            });
