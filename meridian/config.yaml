# Meridian pipeline configuration.
#
# API keys are NEVER in this file; they are read from env vars at runtime:
#   ANTHROPIC_API_KEY, OPENAI_API_KEY.
# Ollama needs no key (local).
#
# Current tier: Level 0 (alternation). See `meridian/BUDGET.md` for the
# tier ladder and the rationale for this schedule.
#
#   Ollama:        every week         (free, local baseline)
#   Claude Opus:   even ISO weeks     (claude-opus-5-5 from 2026-W42)
#   OpenAI GPT:    odd ISO weeks      (gpt-6-astra from 2026-W41)
#
# Roster succession of 2026-10 (weeks are run LABELS, see first_week /
# last_week in meridian/config.py):
#   2026-W41  gpt-5.5 + gpt-6-astra          last gpt-5.5 week, overlap
#   2026-W42  opus-4-8 + opus-5 + opus-5-5   last opus-4-8/opus-5 week, overlap
#   2026-W43+ gpt-6-astra on odd weeks, claude-opus-5-5 on even weeks
# Retired entries stay below with their last_week; never delete them.
#
# Steady-state estimate from 2026-W43: ~$27/week, ~$116/month on a
# 30-prompt corpus. See meridian/BUDGET.md for the per-week figures.

sampling:
  n_default_temp: 20
  n_zero_temp: 5
  default_temperature: 1.0
  zero_temperature: 0.0
  max_tokens: 1024
  concurrency_per_provider: 4

storage:
  raw_dir: "data/raw"
  # S3 archive: the EC2 cohabit architecture uploads raw + manifest +
  # snapshot here; CI downloads from here to publish. When absent the
  # upload code path is dormant. `prefix` MUST match
  # var.archive_bucket_prefix in infra/terraform/ec2-cohabit/ — the
  # IAM policies on both ends are scoped to it.
  s3:
    bucket: "meridian-archive-prod"
    region: "us-east-2"
    prefix: "meridian/"
    publish_latest_pointer: true

runners:
  # Local baseline / control group. Every week because it costs nothing and
  # the silent-update detector needs a continuous reference.
  #
  # `digest` pins the exact model bytes the runner will accept. On startup
  # the ollama runner queries /api/tags and refuses to sample if the served
  # digest doesn't match — a re-pushed upstream model is treated as a
  # broken control-group invariant, not silently rolled into the noise
  # floor. To rotate: `ollama pull <model>`, capture the new digest, audit
  # the change, then update this field. Bare 64-char hex (no "sha256:"
  # prefix) — that's the form ollama's API emits.
  - provider: ollama
    model_id: "llama3.2:3b"
    digest: "a80c4f17acd55265feec403c7aef86be0c25983ab279d83f3bcd3abbcb5b8b72"
    enabled: true
    cadence: every_week

  # Frontier models, alternating to halve the monthly bill on the two
  # line items that dominate it.
  - provider: anthropic
    model_id: "claude-opus-4-8"
    enabled: true
    cadence: even_weeks
    # Succeeded by claude-opus-5-5. Retired after the 2026-W42 overlap
    # week; the entry stays as the record of when the series ended.
    last_week: "2026-W42"

  # Added 2026-08-16. Runs the SAME weeks as claude-opus-4-8 rather than
  # replacing it or alternating with it, for two reasons.
  #
  # The 4-8 series stays intact. Swapping the model id would end that
  # series at 2026-W32 and start a new one, and a drift record whose
  # subject changes is not a drift record.
  #
  # Same-week pairing removes the temporal confound. Two frontier models
  # sampled in the same week against the same corpus differ only by
  # model; split across alternating weeks they also differ by whatever
  # moved in the world that week, which is the thing we are trying to
  # measure. The one-week offset between the alternating frontier
  # runners is already the weakest join in the dataset; do not add
  # another.
  #
  # max_tokens is explicit and is NOT optional here. claude-opus-5 runs
  # adaptive thinking whenever the `thinking` parameter is omitted, and
  # max_tokens caps thinking plus visible output together, so the shared
  # 1024 would be spent on reasoning and return empty completions with
  # no visible answer. That is the 2026-W27 failure exactly (see
  # site/content/reports/2026-07-24-truncated-response-correction.md).
  # 8192 leaves roughly 7k of reasoning headroom above the longest
  # visible response observed on this corpus; billing is on tokens
  # produced, not on the cap. check_run_health.py now reports cap
  # exhaustion instead of publishing it green, so raise this if it says
  # so rather than waiting for a correction.
  - provider: anthropic
    model_id: "claude-opus-5"
    enabled: true
    cadence: even_weeks
    max_tokens: 8192
    # Succeeded by claude-opus-5-5. Retired after the 2026-W42 overlap
    # week, together with claude-opus-4-8.
    last_week: "2026-W42"

  # Added 2026-10-06, first run 2026-W42 (Monday 2026-10-19). Succeeds
  # claude-opus-4-8 and claude-opus-5, which both run alongside it in
  # 2026-W42 only, so the three can be compared on the same week before
  # the older series end.
  #
  # Request shape. Thinking cannot be disabled on this model: a
  # `thinking: {type: "disabled"}` or a `budget_tokens` value is a 400,
  # so the runner sends no `thinking` parameter at all, exactly as it
  # does for claude-opus-5. temperature, top_p and top_k are rejected
  # too; the "claude-opus-5" prefix in runners/anthropic.py already
  # covers this id, which omits temperature and skips the zero-
  # temperature batch.
  #
  # Effort is left at the provider default. Meridian measures what a
  # caller gets by default, so it does not set `effort`. Note for
  # comparisons: the default is "medium" on this model where it was
  # "high" on claude-opus-5. Part of any difference between the two
  # series in the overlap week is that default, not only the weights;
  # the 2026-10-06 roster notice on the site says so.
  #
  # max_tokens matches claude-opus-5 for the same reason: thinking
  # tokens count against it, and the shared 1024 would be spent on
  # reasoning and return empty completions (the 2026-W27 failure).
  # check_run_health.py reports cap exhaustion; raise this if it does.
  #
  # The server-side `fallbacks` parameter is never sent (see
  # runners/anthropic.py). Every sample in this series comes from this
  # model or is recorded as a refusal.
  - provider: anthropic
    model_id: "claude-opus-5-5"
    enabled: true
    cadence: even_weeks
    max_tokens: 8192
    first_week: "2026-W42"

  - provider: openai
    model_id: "gpt-5.5"
    enabled: true
    cadence: odd_weeks
    # gpt-5.5 is reasoning-default and bills reasoning tokens against
    # the completion cap. At the shared 1024 it repeatedly reasoned to
    # the limit and returned an empty body with finish_reason="length":
    # 47/600 samples in 2026-W27 and 43/600 in 2026-W29, concentrated
    # on the most contested prompts (all 20 samples of
    # sci-iq-heritability were lost in both weeks). Those empties were
    # scored as ordinary answers until 2026-07-24. See
    # site/content/reports/2026-07-24-truncated-response-correction.md.
    #
    # 8192 leaves ~7k of reasoning headroom above the longest visible
    # response we have observed from this model (~900 tokens). Cost
    # impact is small: only the requests that were being truncated
    # change behaviour, and billing is on tokens produced, not on the
    # cap. Re-check this if a future reasoning model exhausts it —
    # check_run_health.py will now say so instead of publishing green.
    max_tokens: 8192
    # Succeeded by gpt-6-astra. Retired after the 2026-W41 overlap week.
    last_week: "2026-W41"

  # Added 2026-10-06, first run 2026-W41 (Monday 2026-10-12), the one
  # week it overlaps gpt-5.5. OpenAI's flagship, a reasoning model.
  #
  # Its parameter support is not documented, so it is treated like
  # gpt-5.5: the "gpt-6" prefix in runners/openai.py sends
  # max_completion_tokens rather than max_tokens and omits temperature,
  # which also skips the zero-temperature batch, and it is priced as a
  # reasoning-default model. Reasoning tokens bill against the
  # completion cap, so it gets gpt-5.5's 8192 for the reason documented
  # on that entry above: at the shared 1024 the model can reason to the
  # limit and return an empty body. Effort is left at the provider
  # default, as for every runner.
  - provider: openai
    model_id: "gpt-6-astra"
    enabled: true
    cadence: odd_weeks
    max_tokens: 8192
    first_week: "2026-W41"

# Stance classifier — pinned to Haiku 4.5 for stability:
#   - Cheapest reasonable Claude tier (~$0.80/MT input).
#   - Accepts temperature=0 (current Opus deprecated it; Haiku still
#     honours it), so classifications are deterministic-ish week to week.
#   - Not in the cadence-alternated frontier set, so the classifier
#     itself doesn't drift between weeks while we're measuring drift on
#     other models.
# Disabling sets every metric record's stance to "na". The classifier
# is itself an LLM and shares many biases we measure on others; the
# golden set at meridian/corpus/stance_golden.yaml is the periodic
# re-validation surface.
stance:
  enabled: true
  provider: anthropic
  model_id: "claude-haiku-4-5-20251001"
  cache_path: "data/cache/stance/cache.jsonl"

# Embedding-centroid drift. Cold-start measured at ~60 sec end-to-end
# on a clean HF cache (download + lazy load + first encode); ~4 sec
# warm-start when the model is on disk. The weekly-pipeline workflow
# caches `~/.cache/huggingface` so cold downloads happen at most once
# per cache key. Centroid shift is week-over-week, so the methodology
# page reads "off" for one week after enable and flips to "live" the
# week after.
embedding:
  enabled: true
  model: "sentence-transformers/all-mpnet-base-v2"
